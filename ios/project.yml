name: Textamp
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ''
    SWIFT_OBJC_BRIDGING_HEADER: Textamp/TextampCore.h
    OTHER_LDFLAGS: ['$(inherited)', '-ltextamp_ios', '-lc++', '-liconv', '-framework', 'AudioToolbox', '-framework', 'CoreAudio', '-framework', 'Security', '-framework', 'SystemConfiguration']
    'LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]': '$(SRCROOT)/../target/aarch64-apple-ios-sim/$(RUST_PROFILE)'
    'LIBRARY_SEARCH_PATHS[sdk=iphoneos*]': '$(SRCROOT)/../target/aarch64-apple-ios/$(RUST_PROFILE)'
  configs:
    Debug:
      RUST_PROFILE: debug
    Release:
      RUST_PROFILE: release
targets:
  Textamp:
    configFiles:
      Debug: IconAssets.xcconfig
      Release: IconAssets.xcconfig
    type: application
    platform: iOS
    sources:
      - Textamp
      - path: ../assets/artwork/textamp_clean.ansi
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.textamp.ios
        INFOPLIST_FILE: Textamp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [TextampUITests, TextampTests]
  TextampUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TextampUITests]
    dependencies:
      - target: Textamp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.textamp.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ''
        OTHER_LDFLAGS: ['$(inherited)']

  TextampTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TextampTests]
    dependencies:
      - target: Textamp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.textamp.ios.unit-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ''
        OTHER_LDFLAGS: ['$(inherited)']
