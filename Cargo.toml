[package]
name = "textamp"
version = "1.0.0"
edition = "2021"
description = "A terminal music player for Subsonic, Navidrome, WebDAV and local files"
license = "Unlicense"
authors = ["John Bergmayer"]
keywords = ["subsonic", "navidrome", "music", "tui", "webdav"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["archive/**", "**/.DS_Store"]

[dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "deflate", "charset", "native-tls"] }
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Image decoding (album art)
image = "0.25"
base64 = "0.22"

# Audio playback
rodio = { version = "0.21", features = ["symphonia-all"] }

# Audio decoding for waveform generation
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "flac", "ogg", "wav", "pcm"] }

# FFT for spectrogram generation
rustfft = "6"

# Ring buffer for streaming
ringbuf = "0.4"

# URL encoding
urlencoding = "2"

# UUID for client identifier
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1"
anyhow = "1"
zeroize = "1"
md5 = "0.8" # Subsonic's required salted-password authentication algorithm
flate2 = "1" # Stream large metadata snapshots into compressed local caches.
time = { version = "0.3", features = ["local-offset"] } # Calendar-based radio.

# Directory paths
dirs = "5"

# Async stream utilities
futures = "0.3"

# Plain folder libraries: bounded WebDAV XML and temporary media.
roxmltree = "0.21"
scraper = "0.24"
tempfile = "3"

# Random number generation
rand = "0.9"

# Unicode display width
unicode-width = "0.2"

# Open URLs in default browser
open = "5"

# Terminal input events (key/mouse)
crossterm = "0.28"

# Cross-platform advisory file locking (process lock on the shared cache).
fs4 = "0.9"

# Terminal UI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "9", default-features = false, features = ["crossterm", "image-defaults"] }

# Command-palette: typed text input + fuzzy-match against the command registry.
tui-input = "0.10"
fuzzy-matcher = "0.3"

[[bin]]
name = "textamp"
path = "src/bin/textamp_tui.rs"

[profile.release]
lto = true
strip = true
opt-level = 3
