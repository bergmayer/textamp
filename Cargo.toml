[package]
name = "textamp"
version = "1.0.0"
edition = "2024"
description = "A terminal music player for Subsonic, Navidrome, WebDAV and local files"
license = "Unlicense"
authors = ["John Bergmayer"]
keywords = ["subsonic", "navidrome", "music", "tui", "webdav"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["**/.DS_Store"]

[features]
default = []
mobile = []
desktop = ["dep:gpui-kit", "dep:raw-window-handle"]
desktop-tests = ["desktop", "dep:gpui-test-support"]

[dependencies]
raw-window-handle = { version = "=0.6.2", optional = true }
gpui-kit = { version = "=0.9.0", optional = true }
gpui-test-support = { package = "gpui-pre", version = "=0.3.11", optional = true, features = ["test-support"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "deflate", "charset", "native-tls"] }
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Image decoding (album art)
image = "0.25"
base64 = "0.22"

# Audio playback
rodio = { version = "0.21", features = ["symphonia-all"] }

# Audio decoding for waveform generation
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "flac", "ogg", "wav", "pcm"] }

# FFT for spectrogram generation
rustfft = "6"

# Ring buffer for streaming
ringbuf = "0.4"

# URL encoding
urlencoding = "2"

# UUID for client identifier
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1"
anyhow = "1"
zeroize = "1"
md5 = "0.8" # Subsonic's required salted-password authentication algorithm
flate2 = "1" # Stream large metadata snapshots into compressed local caches.
time = { version = "0.3", features = ["local-offset", "parsing"] } # Calendar-based radio.

# Directory paths
dirs = "5"

# Async stream utilities
futures = "0.3"

# Plain folder libraries: bounded WebDAV XML and temporary media.
roxmltree = "0.21"
ego-tree = "0.10"
scraper = "0.24"
tempfile = "3"

# Random number generation
rand = "0.9"

# Unicode display width
unicode-width = "0.2"
unicode-segmentation = "1.12"

# Open URLs in default browser
open = "5"

# Terminal input events (key/mouse)
crossterm = "0.28"

# Cross-platform advisory file locking (process lock on the shared cache).
fs4 = "0.9"

# Terminal UI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "9", default-features = false, features = ["crossterm", "image-defaults"] }

# Command-palette: typed text input + fuzzy-match against the command registry.
rat-widget = "2.11"
csv = "1.3"
tui-input = "0.10"
fuzzy-matcher = "0.3"

[[bin]]
name = "textamp"
path = "src/bin/textamp_tui.rs"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "System"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3

[profile.dev.package.symphonia-codec-alac]
opt-level = 3

[profile.dev.package.symphonia-codec-pcm]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.symphonia-utils-xiph]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
lto = true
strip = true
opt-level = 3

[patch.crates-io]
# GPUI snapshot uses Option::map_or_default, unstable on Rust 1.95.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

gpui-component = { path = "vendor/gpui-component" }

[workspace]
members = ["ios/core"]
default-members = ["."]
resolver = "3"
